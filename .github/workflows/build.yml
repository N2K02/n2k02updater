name: Updater library
on:
  push:
    branches: [main, feature/updater-core]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_package:
        description: "Publish private updater package to GitHub Packages"
        type: boolean
        required: true
        default: false
      updater_version:
        description: "Package version, e.g. 0.1.0"
        type: string
        required: false
        default: "0.1.0"
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Compile updater
        run: gradle :updater:assembleDebug :updater:assembleRelease :updater:generatePomFileForReleasePublication :updater:testDebugUnitTest :updater:publishReleasePublicationToMavenLocal -PupdaterVersion=0.1.0-ci --stacktrace
      - name: Verify staged Maven package
        run: |
          test -s "$HOME/.m2/repository/dev/n2k02/updater/0.1.0-ci/updater-0.1.0-ci.aar"
          test -s "$HOME/.m2/repository/dev/n2k02/updater/0.1.0-ci/updater-0.1.0-ci.pom"
          test -s "$HOME/.m2/repository/dev/n2k02/updater/0.1.0-ci/updater-0.1.0-ci.module"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_package == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: Publish verified release package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          echo "$UPDATER_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid package version"; exit 1; }
          gradle :updater:publishReleasePublicationToGitHubPackagesRepository -PupdaterVersion="$UPDATER_VERSION" --stacktrace
