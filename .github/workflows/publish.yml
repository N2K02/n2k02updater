name: Publish private updater package

on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  packages: write

concurrency:
  group: updater-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !contains(github.event.pull_request.title, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "main" || { echo "::error::Publish only from reviewed main"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      # One release channel: each merge to main publishes the next 0.1.x version.
      - name: Verify merged commit is current main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
            test "$current" = "$MERGED_SHA" || {
              echo "::notice::Skipping superseded merged commit"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0;
            }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Verify and publish
        if: steps.gate.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$' || exit 1
          gradle :updater:testDebugUnitTest :updater:publishReleasePublicationToGitHubPackagesRepository -PupdaterVersion="$VERSION" --stacktrace
          echo "Published dev.n2k02:updater:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
