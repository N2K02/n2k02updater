name: Publish private updater package

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require protected main branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "main" || { echo "::error::Publish only from reviewed main"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # One release channel: each merge to main publishes the next 0.1.x version.
      - name: Verify and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$' || exit 1
          gradle :updater:testDebugUnitTest :updater:publishReleasePublicationToGitHubPackagesRepository -PupdaterVersion="$VERSION" --stacktrace
          echo "Published dev.n2k02:updater:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
